<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Certeza y medidor</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>html,body{margin:0}body{padding:28px 28px 32px}.certezas{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,19rem));gap:48px 64px;align-items:start}.certezas>.co-grupo{margin-top:0}</style>
</head>
<body class="co">
<div class="certezas">
<div class="co-grupo"><h3 class="co-grupo__cabeza"><svg class="co-ic" aria-hidden="true"><use href="#i-target"/></svg>How sure</h3><div class="co-certeza"><p class="co-certeza__palabra">Likely <small>69 %</small></p><ul class="co-certeza__tramos" aria-hidden="true"><li></li><li></li><li class="is-activo"></li><li></li></ul><p class="co-rotulo"><svg class="co-origen" aria-hidden="true"><use href="#o-estimated"/></svg><span class="co-oculto">Estimated</span><span>At or past NASA’s clinically concerning threshold</span></p></div></div>
<div class="co-grupo"><h3 class="co-grupo__cabeza"><svg class="co-ic" aria-hidden="true"><use href="#i-gauge"/></svg>Quality of the scan</h3><div class="co-lectura"><p class="co-lectura__valor">22.8 <span class="co-lectura__unidad">dB</span></p><p class="co-lectura__rotulo"><svg class="co-origen" aria-hidden="true"><use href="#o-measured"/></svg><span class="co-oculto">Measured</span><span>Mean signal quality</span></p></div><div class="co-medidor" role="img" aria-label="Signal quality 22.8 dB on a scale from 0 to 40; below 15 the signal is poor" style="--valor:57%;--limite:37.5%"><span class="co-medidor__valor"></span><span class="co-medidor__limite"></span></div><p class="co-rotulo">Below 15 dB the signal is poor.</p></div>
<div class="co-grupo"><h3 class="co-grupo__cabeza"><svg class="co-ic" aria-hidden="true"><use href="#i-activity"/></svg>Quality of each scan</h3><div class="co-barras" role="img" aria-label="Quality of each scan so far: 31 of 48 taken, all above 15 dB" style="--limite:37.5%"><i style="--v:62%"></i><i style="--v:60%"></i><i style="--v:63%"></i><i style="--v:60%"></i><i style="--v:57%"></i><i style="--v:59%"></i><i style="--v:65%"></i><i style="--v:61%"></i><i style="--v:58%"></i><i style="--v:62%"></i><i style="--v:65%"></i><i style="--v:60%"></i><i style="--v:57%"></i><i style="--v:59%"></i><i style="--v:63%"></i><i style="--v:61%"></i><i style="--v:58%"></i><i style="--v:62%"></i><i style="--v:64%"></i><i style="--v:60%"></i><i style="--v:57%"></i><i style="--v:61%"></i><i style="--v:63%"></i><i style="--v:59%"></i><i style="--v:62%"></i><i style="--v:57%"></i><i style="--v:61%"></i><i style="--v:63%"></i><i style="--v:59%"></i><i style="--v:60%"></i><i style="--v:61%"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i><i class="is-pendiente"></i></div><p class="co-rotulo">31 of 48 taken · none below 15 dB</p></div>
</div>
