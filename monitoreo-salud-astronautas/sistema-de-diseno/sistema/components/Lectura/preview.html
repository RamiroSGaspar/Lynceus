<!-- Muestra con datos simulados: tripulante ficticio C, día de vuelo 118. No son datos de una persona. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectura</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>html,body{margin:0}body{padding:28px 28px 32px}</style>
</head>
<body class="co">
<div class="co-fila" style="align-items:flex-start;gap:56px">
<div class="co-lectura co-lectura--heroe"><p class="co-lectura__valor">+58 <span class="co-lectura__unidad">µm</span></p><p class="co-lectura__sub">range 47 to 68 µm</p><p class="co-lectura__rotulo"><svg class="co-origen" aria-hidden="true"><use href="#o-derived"/></svg><span class="co-oculto">Calculated</span><span>Change since before the flight</span></p></div>
<div class="co-lectura co-lectura--lg"><p class="co-lectura__valor">476 <span class="co-lectura__unidad">µm</span></p><p class="co-lectura__rotulo"><svg class="co-origen" aria-hidden="true"><use href="#o-measured"/></svg><span class="co-oculto">Measured</span><span>Retinal thickness, 0 to 250 µm ring</span></p></div>
<div class="co-lectura"><p class="co-lectura__valor">22.8 <span class="co-lectura__unidad">dB</span></p><p class="co-lectura__rotulo"><svg class="co-origen" aria-hidden="true"><use href="#o-measured"/></svg><span class="co-oculto">Measured</span><span>Scan quality</span></p></div>
<div class="co-lectura co-lectura--sm"><p class="co-lectura__valor">0.19 <span class="co-lectura__unidad">logMAR</span></p><p class="co-lectura__sub">pre-flight 0.10</p><p class="co-lectura__rotulo"><svg class="co-origen" aria-hidden="true"><use href="#o-self-reported"/></svg><span class="co-oculto">Reported by you</span><span>Near vision</span></p></div>
<div style="max-width:15rem"><div class="co-lectura co-lectura--palabras"><p class="co-lectura__valor">Cannot be measured on board</p><p class="co-lectura__rotulo"><svg class="co-origen" aria-hidden="true"><use href="#o-not-measurable"/></svg><span class="co-oculto">Cannot be measured on board</span><span>Pressure inside the skull</span></p></div></div>
</div>
<script src="../../assets/iconos/sprite.js"></script>
<script>(function(){function avisar(){parent.postMessage({coAlto:document.documentElement.scrollHeight},'*');}addEventListener('load',avisar);addEventListener('resize',avisar);setTimeout(avisar,400);})();</script>
</body>
</html>
