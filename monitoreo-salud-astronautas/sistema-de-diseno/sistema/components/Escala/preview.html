<!-- Muestra con datos simulados: tripulante ficticio C, día de vuelo 118. No son datos de una persona. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala de cambio</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>html,body{margin:0}body{padding:28px 28px 32px}.escalas{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,20rem));gap:48px 64px}.escalas>.co-grupo{margin-top:0}</style>
</head>
<body class="co">
<div class="escalas"><div class="co-grupo"><h3 class="co-grupo__cabeza"><span class="co-ojo"><abbr class="co-ficha" title="Right eye">OD</abbr>Right eye</span></h3><div class="co-escala" role="img" aria-label="Right eye: change of 58 micrometres since your pre-flight exam, range 47 to 68. It falls in the band “Clinically concerning” (55 µm or more). NASA’s thresholds are 19.4 and 55 micrometres. Earlier controls: flight day 30, 27 µm; flight day 58, 37 µm; flight day 90, 48 µm.">
<span class="co-escala__zona co-escala__zona--none" style="--desde:0%;--hasta:32.7%"><span><svg aria-hidden="true"><use href="#l-none"/></svg> Normal variation</span></span>
<span class="co-escala__zona co-escala__zona--advisory" style="--desde:32.7%;--hasta:72.2%"><span><svg aria-hidden="true"><use href="#l-advisory"/></svg> First sign</span></span>
<span class="co-escala__zona co-escala__zona--caution" style="--desde:72.2%;--hasta:100%"><span><svg aria-hidden="true"><use href="#l-caution"/></svg> Clinically concerning</span></span>
<span class="co-escala__umbral co-escala__umbral--cero" style="--x:11.1%"><span>0</span></span>
<span class="co-escala__umbral" style="--x:32.7%"><span>19.4 µm</span></span>
<span class="co-escala__umbral" style="--x:72.2%"><span>55 µm</span></span>
<span class="co-escala__rango" style="--desde:63.8%;--hasta:86.2%"></span>
<span class="co-escala__antes" style="--x:41%"></span><span class="co-escala__antes" style="--x:52.7%"></span><span class="co-escala__antes" style="--x:64.4%"></span>
<span class="co-escala__hoy" style="--x:75%"></span>
</div></div><div class="co-grupo"><h3 class="co-grupo__cabeza"><span class="co-ojo"><abbr class="co-ficha" title="Left eye">OS</abbr>Left eye</span></h3><div class="co-escala" role="img" aria-label="Left eye: change of 33 micrometres since your pre-flight exam, range 23 to 43. It falls in the band “First sign” (above 19.4 and below 55 µm). NASA’s thresholds are 19.4 and 55 micrometres. Earlier controls: flight day 30, 15 µm; flight day 58, 21 µm; flight day 90, 27 µm.">
<span class="co-escala__zona co-escala__zona--none" style="--desde:0%;--hasta:32.7%"><span><svg aria-hidden="true"><use href="#l-none"/></svg> Normal variation</span></span>
<span class="co-escala__zona co-escala__zona--advisory" style="--desde:32.7%;--hasta:72.2%"><span><svg aria-hidden="true"><use href="#l-advisory"/></svg> First sign</span></span>
<span class="co-escala__zona co-escala__zona--caution" style="--desde:72.2%;--hasta:100%"><span><svg aria-hidden="true"><use href="#l-caution"/></svg> Clinically concerning</span></span>
<span class="co-escala__umbral co-escala__umbral--cero" style="--x:11.1%"><span>0</span></span>
<span class="co-escala__umbral" style="--x:32.7%"><span>19.4 µm</span></span>
<span class="co-escala__umbral" style="--x:72.2%"><span>55 µm</span></span>
<span class="co-escala__rango" style="--desde:36.2%;--hasta:58.9%"></span>
<span class="co-escala__antes" style="--x:27.7%"></span><span class="co-escala__antes" style="--x:34%"></span><span class="co-escala__antes" style="--x:41.2%"></span>
<span class="co-escala__hoy" style="--x:47.6%"></span>
</div></div></div><div style="margin-top:28px"><ul class="co-leyenda"><li><span class="co-escala__hoy" style="position:static;transform:none;display:inline-block;width:0.75rem;height:0.75rem;box-shadow:none"></span> Today, with its range</li><li><span class="co-escala__antes" style="position:static;transform:none;display:inline-block"></span> Earlier controls, with their flight day</li></ul></div>
<script src="../../assets/iconos/sprite.js"></script>

</body>
</html>
