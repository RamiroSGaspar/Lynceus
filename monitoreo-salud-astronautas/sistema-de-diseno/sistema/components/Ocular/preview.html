<!-- Muestra con datos simulados: tripulante ficticio C, día de vuelo 118. No son datos de una persona. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocular</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>html,body{margin:0}body{padding:28px 28px 32px}body{padding-top:44px}</style>
</head>
<body class="co co-campo">
<div class="co-fila" style="align-items:flex-start;justify-content:center;gap:88px;--ocular-size:15rem">
<figure class="co-ocular co-ocular--caution is-elegido">
<div class="co-ocular__cabeza co-halo"><span class="co-ojo"><abbr class="co-ficha" title="Right eye">OD</abbr>Right eye</span><span class="co-nivel co-nivel--caution"><svg class="co-nivel__forma" aria-hidden="true"><use href="#l-caution"/></svg><span class="co-nivel__clase">Caution</span><span class="co-nivel__nombre">Clinically concerning</span></span><span class="co-ocular__hallazgo"><svg class="co-ic" aria-hidden="true"><use href="#i-corte"/></svg>New folds</span></div>
<div class="co-ocular__campo">
<button type="button" class="co-ocular__lente" data-ojo="OD" aria-pressed="true" aria-label="Fundus image of the right eye. The ellipse fitted to the optic nerve opening and the four measurement rings are drawn on it. Simulated data.">
<img class="co-ocular__imagen" src="../../assets/img/simulado-fondo-C-OD-d118.jpg" alt=""><svg class="co-ocular__marcas" viewBox="0 0 100 100" aria-hidden="true"><ellipse class="co-zona" cx="48.8" cy="50.6" rx="17.7" ry="15.5" transform="rotate(99.835 48.8 50.6)" stroke-width="4.6"/><ellipse class="co-trazo co-trazo--base" cx="48.8" cy="50.6" rx="15.4" ry="13.2" transform="rotate(99.835 48.8 50.6)"/><ellipse class="co-trazo" cx="48.8" cy="50.6" rx="15.4" ry="13.2" transform="rotate(99.835 48.8 50.6)"/><ellipse class="co-trazo co-trazo--base" cx="48.8" cy="50.6" rx="20" ry="17.8" transform="rotate(99.835 48.8 50.6)"/><ellipse class="co-trazo co-trazo--trazos" cx="48.8" cy="50.6" rx="20" ry="17.8" transform="rotate(99.835 48.8 50.6)"/><ellipse class="co-trazo co-trazo--puntos" cx="48.8" cy="50.6" rx="24.7" ry="22.5" transform="rotate(99.835 48.8 50.6)"/><ellipse class="co-trazo co-trazo--puntos" cx="48.8" cy="50.6" rx="33.9" ry="31.7" transform="rotate(99.835 48.8 50.6)"/><ellipse class="co-trazo co-trazo--puntos" cx="48.8" cy="50.6" rx="43.2" ry="41" transform="rotate(99.835 48.8 50.6)"/></svg><span class="co-sello">Simulated</span>
</button>
<span class="co-ocular__anillo"></span>
<svg class="co-ocular__guia" viewBox="0 0 100 100" aria-hidden="true"><line class="co-trazo co-trazo--base" x1="48.1" y1="68.2" x2="48.1" y2="99"/><line class="co-trazo" x1="48.1" y1="68.2" x2="48.1" y2="113"/><circle class="co-punto co-punto--lleno" cx="48.1" cy="68.2" r="1.4"/></svg>
</div>
<figcaption class="co-ocular__pie co-halo"><div class="co-lectura co-lectura--heroe"><p class="co-lectura__valor">+58 <span class="co-lectura__unidad">µm</span></p><p class="co-lectura__sub">range 47 to 68 µm</p><p class="co-lectura__rotulo"><svg class="co-origen" aria-hidden="true"><use href="#o-derived"/></svg><span class="co-oculto">Calculated</span><span>Change since before the flight</span></p></div></figcaption>
</figure>
<figure class="co-ocular co-ocular--advisory">
<div class="co-ocular__cabeza co-halo"><span class="co-ojo"><abbr class="co-ficha" title="Left eye">OS</abbr>Left eye</span><span class="co-nivel co-nivel--advisory"><svg class="co-nivel__forma" aria-hidden="true"><use href="#l-advisory"/></svg><span class="co-nivel__clase">Advisory</span><span class="co-nivel__nombre">First sign</span></span><span class="co-ocular__hallazgo"><svg class="co-ic" aria-hidden="true"><use href="#i-corte"/></svg>New folds</span></div>
<div class="co-ocular__campo">
<button type="button" class="co-ocular__lente" data-ojo="OS" aria-pressed="false" aria-label="Fundus image of the left eye. The ellipse fitted to the optic nerve opening and the four measurement rings are drawn on it. Simulated data.">
<img class="co-ocular__imagen" src="../../assets/img/simulado-fondo-C-OS-d118.jpg" alt=""><svg class="co-ocular__marcas" viewBox="0 0 100 100" aria-hidden="true"><ellipse class="co-zona" cx="51" cy="53.8" rx="17.1" ry="16.4" transform="rotate(97.402 51 53.8)" stroke-width="4.6"/><ellipse class="co-trazo co-trazo--base" cx="51" cy="53.8" rx="14.8" ry="14.1" transform="rotate(97.402 51 53.8)"/><ellipse class="co-trazo" cx="51" cy="53.8" rx="14.8" ry="14.1" transform="rotate(97.402 51 53.8)"/><ellipse class="co-trazo co-trazo--base" cx="51" cy="53.8" rx="19.4" ry="18.7" transform="rotate(97.402 51 53.8)"/><ellipse class="co-trazo co-trazo--trazos" cx="51" cy="53.8" rx="19.4" ry="18.7" transform="rotate(97.402 51 53.8)"/><ellipse class="co-trazo co-trazo--puntos" cx="51" cy="53.8" rx="24.1" ry="23.4" transform="rotate(97.402 51 53.8)"/><ellipse class="co-trazo co-trazo--puntos" cx="51" cy="53.8" rx="33.3" ry="32.6" transform="rotate(97.402 51 53.8)"/><ellipse class="co-trazo co-trazo--puntos" cx="51" cy="53.8" rx="42.6" ry="41.9" transform="rotate(97.402 51 53.8)"/></svg><span class="co-sello">Simulated</span>
</button>
<span class="co-ocular__anillo"></span>
<svg class="co-ocular__guia" viewBox="0 0 100 100" aria-hidden="true"><line class="co-trazo co-trazo--base" x1="50.8" y1="70.9" x2="50.8" y2="99"/><line class="co-trazo" x1="50.8" y1="70.9" x2="50.8" y2="113"/><circle class="co-punto co-punto--lleno" cx="50.8" cy="70.9" r="1.4"/></svg>
</div>
<figcaption class="co-ocular__pie co-halo"><div class="co-lectura co-lectura--heroe"><p class="co-lectura__valor">+33 <span class="co-lectura__unidad">µm</span></p><p class="co-lectura__sub">range 23 to 43 µm</p><p class="co-lectura__rotulo"><svg class="co-origen" aria-hidden="true"><use href="#o-derived"/></svg><span class="co-oculto">Calculated</span><span>Change since before the flight</span></p></div></figcaption>
</figure>
<figure class="co-ocular co-ocular--unmeasured"><div class="co-ocular__cabeza co-halo"><span class="co-ojo"><abbr class="co-ficha" title="Left eye">OS</abbr>Left eye</span><span class="co-nivel co-nivel--unmeasured"><svg class="co-nivel__forma" aria-hidden="true"><use href="#l-unmeasured"/></svg><span class="co-nivel__nombre">Could not be measured</span></span></div><div class="co-ocular__campo"><div class="co-ocular__lente"><span class="co-ocular__vacio"><svg class="co-ic co-ic--lg" aria-hidden="true"><use href="#i-scan-eye"/></svg>I cannot measure this eye today</span></div></div><figcaption class="co-ocular__pie co-halo" style="margin-top:var(--space-6)"><p class="co-nota" style="max-width:15rem">Too few usable scans after 3 attempts.</p></figcaption></figure>
</div>
<div class="co-halo" style="width:fit-content;margin:36px auto 0"><ul class="co-leyenda"><li><svg class="co-muestra" viewBox="0 0 28 10" aria-hidden="true"><path class="co-trazo" d="M1 5h26"/></svg> Optic nerve opening</li><li><svg class="co-muestra" viewBox="0 0 28 10" aria-hidden="true"><path class="co-zona" stroke-width="7" d="M1 5h26"/><path class="co-trazo" d="M1 1h26"/><path class="co-trazo co-trazo--trazos" d="M1 9h26"/></svg> Main ring zone (0–250 µm)</li><li><svg class="co-muestra" viewBox="0 0 28 10" aria-hidden="true"><path class="co-trazo co-trazo--puntos" d="M1 5h26"/></svg> Ring limits</li></ul></div>
<script src="../../assets/iconos/sprite.js"></script>
<script>(function(){function avisar(){parent.postMessage({coAlto:document.documentElement.scrollHeight},'*');}addEventListener('load',avisar);addEventListener('resize',avisar);setTimeout(avisar,400);})();</script>
</body>
</html>
